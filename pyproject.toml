[project]
name = "cryptospread"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "asyncpg>=0.31.0",
    "numpy>=2.4.5",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "python-telegram-bot>=22.7",
    "redis>=7.4.0",
    "structlog>=25.5.0",
    "websockets>=16.0",
    "ruff>=0.9.9",
    "mypy>=1.15.0",
    "aiogram>=3.28.2",
    "pydantic-settings>=2.14.1",
    "sqlalchemy>=2.0.49",
    "aiosqlite>=0.22.1",
    "ccxt>=4.5.54",
    "psutil>=7.2.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
norecursedirs = ["backups"]

